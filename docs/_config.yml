# --- Site ---
title: Microsoft Samples
description: >-
  Code samples and enablement docs for Microsoft Dynamics 365, the Power
  Platform, Azure, and agentic desktop assistants (Autopilots).
url: "https://aliyoussefi.github.io"
baseurl: "/Samples"

# --- Theme (Just the Docs, via Gemfile + GitHub Actions build) ---
theme: just-the-docs

# Apply the theme's default layout to every page unless a page overrides it.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# --- Search ---
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# --- Top-right auxiliary links ---
aux_links:
  "View on GitHub":
    - "https://github.com/aliyoussefi/Samples"
aux_links_new_tab: true

# --- "Edit this page on GitHub" links ---
gh_edit_link: true
gh_edit_repository: "https://github.com/aliyoussefi/Samples"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# --- Footer / navigation UX ---
back_to_top: true
back_to_top_text: "Back to top"
footer_content: >-
  Copyright &copy; Ali Youssefi. Distributed under the repository LICENSE.

# --- Callouts (used with {: .note } / {: .warning } / {: .tip }) ---
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green

# --- Plugins ---
plugins:
  - jekyll-seo-tag

# Exclude local build/dev files from the published site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
